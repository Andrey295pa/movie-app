<div>
  <button (click)="goMainView()">Back</button>
   <p *ngIf="films.length <1 ">You didn't choose any film. List empty now.</p>
    <ul *ngFor="let film of films">
      <li style="background-image: url({{imgPath}}{{film.backdrop_path}})" >
         {{film.title}}
      <p>{{film.overview}}</p>
      </li>
 </ul>
</div>
