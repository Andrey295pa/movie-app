
<div class="body" style="background-image: url({{imgPath}})">
  <div class="container" >
    <h3>{{film?.title}}</h3>
    <p>Release date: {{film?.release_date}}</p>
    <p>Rating film : {{film?.vote_average}}</p>
    <h3>Origin name : {{film?.original_title}}</h3>
    <p>{{film?.overview}}</p>
  </div>

  <button (click)="goMainView()">Go back</button>
</div>
